name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archives:
    name: Build and publish archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      # A tag that cannot pass the test suite should not become a release.
      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Build archives
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<NOTES
          Built from \`${GITHUB_SHA}\` by [this workflow](${RUN_URL}).

          Verify a download against \`checksums_${TAG}.txt\`:

          \`\`\`sh
          sha256sum -c "checksums_${TAG}.txt" --ignore-missing
          \`\`\`
          NOTES

          # A tag like v1.2.0-rc1 is published as a pre-release.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*

  container:
    name: Build and publish container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build stage runs on the native platform and cross-compiles, and the
      # runtime stage only copies a binary, so no emulation is needed.
      - name: Publish image
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          echo "${{ github.token }}" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          tags=(--tag "${IMAGE}:${TAG}")
          # A pre-release tag must not move :latest.
          case "$TAG" in
            *-*) ;;
            *) tags+=(--tag "${IMAGE}:latest") ;;
          esac

          docker buildx create --use --name release >/dev/null
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${TAG}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.licenses=BSD-3-Clause" \
            "${tags[@]}" \
            --push .
